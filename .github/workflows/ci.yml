name: Run Python Tests

on:
  push:
    branches:
      - feature/add-ci-workflow  # Change this later to 'main'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', 3.11]  # Matrix to test multiple Python versions
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run tests
      run: pytest --cov=bank_account --cov-fail-under=90  # Enforce coverage >= 90%
      
    - name: Use GitHub Secrets example
      run: echo "Secret is ${{ secrets.MY_SECRET }}"